<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 651" width="800" height="651" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Cierre de ventana, salida y auto-arranque</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="651" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,133 100,133" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario cierra la ventana (X)</tspan></text>
<line x1="260" y1="133" x2="260" y2="167" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,167 425,210.0 260,253 95,210.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="202.0">¿app.isQuitting es</tspan><tspan x="260" y="219.0">verdadero?</tspan></text>
<text x="268" y="273" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="210.0" x2="480" y2="210.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="204.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="173.5" width="220" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="197.5">Cancelar el cierre y</tspan><tspan x="590" y="214.5">ocultar la ventana (sigue</tspan><tspan x="590" y="231.5">en la bandeja)</tspan></text>
<line x1="590" y1="246.5" x2="590" y2="270.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="270.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="293.5">Fin</tspan></text>
<line x1="260" y1="253" x2="260" y2="287" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="287" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="311">mainWindow = null; window-all-closed</tspan><tspan x="260" y="328">ejecuta app.quit()</tspan></text>
<line x1="260" y1="343" x2="260" y2="377" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,377 420,377 404,450 100,450" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="401">Usuario puede activar Auto-</tspan><tspan x="260" y="418">Launch: isEnabled y enable o</tspan><tspan x="260" y="435">disable de auto-launch</tspan></text>
<line x1="260" y1="450" x2="260" y2="484" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="484" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="508">Quit en la bandeja marca isQuitting</tspan><tspan x="260" y="525">y app.quit(); el túnel y el</tspan><tspan x="260" y="542">contenedor NO se detienen</tspan></text>
<line x1="260" y1="557" x2="260" y2="591" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="591" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="615.5">Fin</tspan></text>
</svg>
