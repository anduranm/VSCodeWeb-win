<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 951" width="800" height="951" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Arranque de la aplicación</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="951" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,150 100,150" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario abre VSCodeWeb (evento</tspan><tspan x="260" y="135">ready)</tspan></text>
<line x1="260" y1="150" x2="260" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="184" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="208">checkDocker: ejecutar «docker</tspan><tspan x="260" y="225">--version»</tspan></text>
<line x1="260" y1="240" x2="260" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,274 425,317.0 260,360 95,317.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="309.0">¿docker --version</tspan><tspan x="260" y="326.0">respondió sin error?</tspan></text>
<text x="268" y="380" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="317.0" x2="480" y2="317.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="311.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="289.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="313.0">Mensaje «Docker No</tspan><tspan x="590" y="330.0">Instalado» y app.quit()</tspan></text>
<line x1="590" y1="345.0" x2="590" y2="369.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="369.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="392.0">Fin</tspan></text>
<line x1="260" y1="360" x2="260" y2="394" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="394" width="320" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="418">startDocker: ejecutar «docker info»</tspan></text>
<line x1="260" y1="433" x2="260" y2="467" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,467 425,510.0 260,553 95,510.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="502.0">¿docker info respondió</tspan><tspan x="260" y="519.0">sin error?</tspan></text>
<text x="268" y="573" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="510.0" x2="480" y2="510.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="504.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="482.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="506.0">Abrir Docker Desktop (ruta</tspan><tspan x="590" y="523.0">fija) y esperar 5 s</tspan></text>
<line x1="590" y1="538.0" x2="590" y2="562.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="562.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="585.0">Fin</tspan></text>
<line x1="260" y1="553" x2="260" y2="587" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="587" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="611">dockerRunning = true y callback</tspan><tspan x="260" y="628">(aunque Docker Desktop no haya</tspan><tspan x="260" y="645">arrancado)</tspan></text>
<line x1="260" y1="660" x2="260" y2="694" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="694" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="718">createWindow: ventana 1200x750,</tspan><tspan x="260" y="735">carga index.html y envía loadConfig</tspan></text>
<line x1="260" y1="750" x2="260" y2="784" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="784" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="808">createTray: icono en la bandeja con</tspan><tspan x="260" y="825">Config, Start, Stop, Restart, Auto-</tspan><tspan x="260" y="842">Launch y Quit</tspan></text>
<line x1="260" y1="857" x2="260" y2="891" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="891" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="915.5">Fin</tspan></text>
</svg>
