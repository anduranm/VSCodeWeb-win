<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 758" width="800" height="758" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Actualizar el contenedor (y eliminarlo)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="758" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,167 100,167" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario pulsa Update Docker</tspan><tspan x="260" y="135">Container (Delete usa solo los</tspan><tspan x="260" y="152">dos primeros pasos)</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">deleteDockerContainer: exec «docker-</tspan><tspan x="260" y="242">compose down» sin esperar</tspan></text>
<line x1="260" y1="257" x2="260" y2="291" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,291 425,334.0 260,377 95,334.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="326.0">¿docker-compose down</tspan><tspan x="260" y="343.0">terminó sin error?</tspan></text>
<text x="268" y="397" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="334.0" x2="480" y2="334.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="328.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="297.5" width="220" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="321.5">Diálogo «Failed to stop</tspan><tspan x="590" y="338.5">and remove containers» (el</tspan><tspan x="590" y="355.5">flujo sigue igual)</tspan></text>
<line x1="590" y1="370.5" x2="590" y2="394.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="394.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="417.5">Fin</tspan></text>
<line x1="260" y1="377" x2="260" y2="411" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="411" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="435">Esperar 1 s fijo (setTimeout), sin</tspan><tspan x="260" y="452">comprobar que down haya terminado</tspan></text>
<line x1="260" y1="467" x2="260" y2="501" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="501" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="525">mountDockerContainer: exec «docker-</tspan><tspan x="260" y="542">compose up -d»</tspan></text>
<line x1="260" y1="557" x2="260" y2="591" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,591 420,591 404,664 100,664" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="615">El renderer muestra «updated</tspan><tspan x="260" y="632">successfully» sin esperar el</tspan><tspan x="260" y="649">resultado real</tspan></text>
<line x1="260" y1="664" x2="260" y2="698" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="698" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="722.5">Fin</tspan></text>
</svg>
