<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 737" width="800" height="737" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Detener y reiniciar servicios</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="737" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,150 100,150" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario elige Stop o Restart en</tspan><tspan x="260" y="135">la bandeja</tspan></text>
<line x1="260" y1="150" x2="260" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,184 425,227.0 260,270 95,227.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="219.0">¿existe un túnel</tspan><tspan x="260" y="236.0">abierto?</tspan></text>
<text x="268" y="290" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="227.0" x2="480" y2="227.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="221.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="199.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="223.0">Se omite el cierre del</tspan><tspan x="590" y="240.0">túnel</tspan></text>
<line x1="590" y1="255.0" x2="590" y2="279.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="279.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="302.0">Fin</tspan></text>
<line x1="260" y1="270" x2="260" y2="304" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="304" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="328">tunnel.close; si falla, diálogo</tspan><tspan x="260" y="345">«LocalTunnel Error»</tspan></text>
<line x1="260" y1="360" x2="260" y2="394" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="394" width="320" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="418">exec «docker stop code-server»</tspan></text>
<line x1="260" y1="433" x2="260" y2="467" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,467 425,510.0 260,553 95,510.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="502.0">¿docker stop terminó sin</tspan><tspan x="260" y="519.0">error?</tspan></text>
<text x="268" y="573" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="510.0" x2="480" y2="510.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="504.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="482.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="506.0">Diálogo «Docker Error» con</tspan><tspan x="590" y="523.0">la salida</tspan></text>
<line x1="590" y1="538.0" x2="590" y2="562.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="562.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="585.0">Fin</tspan></text>
<line x1="260" y1="553" x2="260" y2="587" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="587" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="611">Si fue Restart: esperar 3 s fijos y</tspan><tspan x="260" y="628">ejecutar el flujo Iniciar servicios</tspan></text>
<line x1="260" y1="643" x2="260" y2="677" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="677" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="701.5">Fin</tspan></text>
</svg>
