<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 651" width="800" height="651" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Montar el contenedor</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="651" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,150 100,150" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario pulsa Mount Docker</tspan><tspan x="260" y="135">Container</tspan></text>
<line x1="260" y1="150" x2="260" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="184" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="208">IPC mount-docker-container invoca</tspan><tspan x="260" y="225">mountDockerContainer</tspan></text>
<line x1="260" y1="240" x2="260" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="274" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="298">exec «docker-compose -f docker-</tspan><tspan x="260" y="315">compose.yml up -d» (sin esperar)</tspan></text>
<line x1="260" y1="330" x2="260" y2="364" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="364" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="388">El IPC responde de inmediato y el</tspan><tspan x="260" y="405">renderer muestra «mounted</tspan><tspan x="260" y="422">successfully»</tspan></text>
<line x1="260" y1="437" x2="260" y2="471" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,471 425,514.0 260,557 95,514.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="506.0">¿docker-compose terminó</tspan><tspan x="260" y="523.0">sin error?</tspan></text>
<text x="268" y="577" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="514.0" x2="480" y2="514.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="508.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="477.5" width="220" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="501.5">Diálogo «Mount Docker</tspan><tspan x="590" y="518.5">Container: Failed» con la</tspan><tspan x="590" y="535.5">salida</tspan></text>
<line x1="590" y1="550.5" x2="590" y2="574.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="574.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="597.5">Fin</tspan></text>
<line x1="260" y1="557" x2="260" y2="591" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="591" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="615.5">Fin</tspan></text>
