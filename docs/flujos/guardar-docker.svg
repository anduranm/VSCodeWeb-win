<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 895" width="800" height="895" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Guardar configuración de Docker</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="895" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,167 100,167" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario edita Port y Password y</tspan><tspan x="260" y="135">pulsa Save Configuration</tspan><tspan x="260" y="152">(docker)</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">saveDockerConfiguration envía {port,</tspan><tspan x="260" y="242">password, volumes} por IPC save-</tspan><tspan x="260" y="259">docker-config</tspan></text>
<line x1="260" y1="274" x2="260" y2="308" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,308 425,351.0 260,394 95,351.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="343.0">¿dockerConfig está</tspan><tspan x="260" y="360.0">cargado en memoria?</tspan></text>
<text x="268" y="414" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="351.0" x2="480" y2="351.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="345.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="306.0" width="220" height="90" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="330.0">console.error «Docker</tspan><tspan x="590" y="347.0">configuration is not</tspan><tspan x="590" y="364.0">loaded» y no se guarda</tspan><tspan x="590" y="381.0">nada</tspan></text>
<line x1="590" y1="396.0" x2="590" y2="420.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="420.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="443.0">Fin</tspan></text>
<line x1="260" y1="394" x2="260" y2="428" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,428 425,471.0 260,514 95,471.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="463.0">¿hay al menos un</tspan><tspan x="260" y="480.0">volumen?</tspan></text>
<text x="268" y="534" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="471.0" x2="480" y2="471.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="465.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="443.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="467.0">Abrir selector de carpetas</tspan><tspan x="590" y="484.0">(selectVolumeDirectories)</tspan></text>
<line x1="590" y1="499.0" x2="590" y2="523.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="523.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="546.0">Fin</tspan></text>
<line x1="260" y1="514" x2="260" y2="548" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="548" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="572">Reescribir ports (puerto:8080),</tspan><tspan x="260" y="589">environment (PASSWORD) y volumes del</tspan><tspan x="260" y="606">servicio code-server</tspan></text>
<line x1="260" y1="621" x2="260" y2="655" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="655" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="679">saveDockerComposeFile: yaml.dump a</tspan><tspan x="260" y="696">docker-compose.yml en userData</tspan></text>
<line x1="260" y1="711" x2="260" y2="745" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,745 420,745 404,801 100,801" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="769">Aviso «Docker-compose saved</tspan><tspan x="260" y="786">successfully» (alert)</tspan></text>
<line x1="260" y1="801" x2="260" y2="835" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="835" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="859.5">Fin</tspan></text>
</svg>
