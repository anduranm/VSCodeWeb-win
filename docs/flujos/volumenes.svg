<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 814" width="800" height="814" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Agregar y quitar carpetas montadas</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="814" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,133 100,133" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">Usuario pulsa Add Volume</tspan></text>
<line x1="260" y1="133" x2="260" y2="167" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="167" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="191">IPC select-folder: showOpenDialog</tspan><tspan x="260" y="208">con selección múltiple de carpetas</tspan></text>
<line x1="260" y1="223" x2="260" y2="257" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,257 425,300.0 260,343 95,300.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="292.0">¿el usuario aceptó el</tspan><tspan x="260" y="309.0">diálogo?</tspan></text>
<text x="268" y="363" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="300.0" x2="480" y2="300.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="294.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="272.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="296.0">Devuelve lista vacía; la</tspan><tspan x="590" y="313.0">lista no cambia</tspan></text>
<line x1="590" y1="328.0" x2="590" y2="352.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="352.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="375.0">Fin</tspan></text>
<line x1="260" y1="343" x2="260" y2="377" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="377" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="401">Cada carpeta se convierte en</tspan><tspan x="260" y="418">«ruta:/home/coder/&lt;última carpeta&gt;»</tspan></text>
<line x1="260" y1="433" x2="260" y2="467" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="467" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="491">renderer.js agrega los volúmenes a</tspan><tspan x="260" y="508">volumePaths y redibuja la lista</tspan></text>
<line x1="260" y1="523" x2="260" y2="557" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,557 420,557 404,630 100,630" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="581">Usuario pulsa Delete en un</tspan><tspan x="260" y="598">volumen: splice del índice y</tspan><tspan x="260" y="615">redibujo</tspan></text>
<line x1="260" y1="630" x2="260" y2="664" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="664" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="688">Nada se persiste hasta pulsar Save</tspan><tspan x="260" y="705">Configuration (Docker)</tspan></text>
<line x1="260" y1="720" x2="260" y2="754" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="754" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="778.5">Fin</tspan></text>
